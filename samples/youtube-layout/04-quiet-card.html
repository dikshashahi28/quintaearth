<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>YouTube sample — Quiet channel card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #FFFFFE; color: #2c2419; }
  .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B7A45; padding: 16px 20px 0; margin: 0; }
  .band { padding: 28px 0 48px; background: #FFFFFE; }
  .band::before { content: ""; display: block; width: min(920px, calc(100% - 64px)); height: 1px; margin: 0 auto 20px; background: #d9cbb4; }
  .wrap { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
  .band h2 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 36px; margin: 0 0 14px; letter-spacing: -0.01em; }
  a.btn { display: inline-block; margin-top: 14px; padding: 10px 18px; border: 1px solid #24301A; color: #24301A; text-decoration: none; font-size: 14px; letter-spacing: 0.02em; }
  a.btn:hover { background: #24301A; color: #F3F5EC; }
  .note { color: #5c4a36; font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
<p class="label">Sample 4 — Quiet channel card</p>

<style>
  #youtube .wrap { text-align: center; }
  .card {
    max-width: 680px; margin: 8px auto 0; padding: 36px 40px 40px;
    background: #F3F5EC; border: 1px solid #d5dbc8; text-align: center;
  }
  .card h2 { margin: 0 0 10px; color: #24301A; }
  .tag { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7A45; margin-bottom: 14px; }
  .card p { margin: 0; font-size: 16px; line-height: 1.65; color: #5c4a36; }
  @media (max-width: 600px) { .card { padding: 28px 22px; } }
</style>
<section class="band" id="youtube"><div class="wrap">
  <div class="card">
    <div class="tag">Channel</div>
    <h2>YouTube</h2>
    <p>The QuintaEarth channel will sit here — films, maker notes, and greentech conversations. Add the channel link when you have it.</p>
    <a class="btn" href="#">Visit channel</a>
  </div>
</div></section>
</body></html>
