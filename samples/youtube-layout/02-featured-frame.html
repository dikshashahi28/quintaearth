<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>YouTube sample — Featured frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #FFFFFE; color: #2c2419; }
  .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B7A45; padding: 16px 20px 0; margin: 0; }
  .band { padding: 28px 0 48px; background: #FFFFFE; }
  .band::before { content: ""; display: block; width: min(920px, calc(100% - 64px)); height: 1px; margin: 0 auto 20px; background: #d9cbb4; }
  .wrap { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
  .band h2 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 36px; margin: 0 0 14px; letter-spacing: -0.01em; }
  a.btn { display: inline-block; margin-top: 14px; padding: 10px 18px; border: 1px solid #24301A; color: #24301A; text-decoration: none; font-size: 14px; letter-spacing: 0.02em; }
  a.btn:hover { background: #24301A; color: #F3F5EC; }
  .note { color: #5c4a36; font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
<p class="label">Sample 2 — Featured frame</p>

<style>
  #youtube .wrap { text-align: center; }
  .frame {
    position: relative; max-width: 720px; margin: 12px auto 0;
    aspect-ratio: 16/9; background: #F3F5EC; border: 1px solid #d5dbc8;
    display: flex; align-items: center; justify-content: center;
  }
  .play {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid #24301A; display: flex; align-items: center; justify-content: center;
  }
  .play::after {
    content: ""; display: block; width: 0; height: 0;
    border-left: 16px solid #24301A; border-top: 10px solid transparent; border-bottom: 10px solid transparent;
    margin-left: 4px;
  }
  .sub { max-width: 520px; margin: 18px auto 0; color: #5c4a36; font-size: 15px; line-height: 1.6; }
</style>
<section class="band" id="youtube"><div class="wrap">
  <h2>YouTube</h2>
  <div class="frame" aria-hidden="true"><div class="play"></div></div>
  <p class="sub">Watch the QuintaEarth channel — stories from startups, makers, and the greentech field.</p>
  <a class="btn" href="#">Visit channel</a>
</div></section>
</body></html>
