<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>YouTube sample — Video grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #FFFFFE; color: #2c2419; }
  .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B7A45; padding: 16px 20px 0; margin: 0; }
  .band { padding: 28px 0 48px; background: #FFFFFE; }
  .band::before { content: ""; display: block; width: min(920px, calc(100% - 64px)); height: 1px; margin: 0 auto 20px; background: #d9cbb4; }
  .wrap { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
  .band h2 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 36px; margin: 0 0 14px; letter-spacing: -0.01em; }
  a.btn { display: inline-block; margin-top: 14px; padding: 10px 18px; border: 1px solid #24301A; color: #24301A; text-decoration: none; font-size: 14px; letter-spacing: 0.02em; }
  a.btn:hover { background: #24301A; color: #F3F5EC; }
  .note { color: #5c4a36; font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
<p class="label">Sample 3 — Video grid</p>

<style>
  #youtube .wrap { text-align: center; }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
    margin-top: 12px; text-align: left;
  }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .card { border: 1px solid #d5dbc8; background: #FFFFFE; }
  .thumb { aspect-ratio: 16/9; background: #F3F5EC; display: flex; align-items: center; justify-content: center; color: #6B7A45; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .card .meta { padding: 12px 14px 16px; }
  .card h3 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 20px; margin: 0 0 6px; color: #24301A; }
  .card p { margin: 0; font-size: 13px; line-height: 1.5; color: #5c4a36; }
  .cta { margin-top: 20px; }
</style>
<section class="band" id="youtube"><div class="wrap">
  <h2>YouTube</h2>
  <p class="note" style="max-width:560px;margin:0 auto 4px">Recent films from the channel.</p>
  <div class="grid">
    <div class="card"><div class="thumb">Film 01</div><div class="meta"><h3>Field note</h3><p>Placeholder title for a film.</p></div></div>
    <div class="card"><div class="thumb">Film 02</div><div class="meta"><h3>Maker story</h3><p>Placeholder title for a film.</p></div></div>
    <div class="card"><div class="thumb">Film 03</div><div class="meta"><h3>Press cut</h3><p>Placeholder title for a film.</p></div></div>
  </div>
  <div class="cta"><a class="btn" href="#">Visit channel</a></div>
</div></section>
</body></html>
