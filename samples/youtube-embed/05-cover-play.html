<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>YouTube embed sample — Cover play</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #FFFFFE; color: #2c2419; }
  .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B7A45; padding: 16px 20px 8px; margin: 0; }
  .hint { font-size: 13px; color: #8a7a66; padding: 0 20px 8px; margin: 0; }
  .band { padding: 20px 0 48px; background: #FFFFFE; }
  .band::before { content: ""; display: block; width: min(920px, calc(100% - 64px)); height: 1px; margin: 0 auto 20px; background: #d9cbb4; }
  .wrap { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
  .band h2 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 36px; margin: 0 0 14px; letter-spacing: -0.01em; }
  .player { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; overflow: hidden; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  a.btn { display: inline-block; margin-top: 14px; padding: 10px 18px; border: 1px solid #24301A; color: #24301A; text-decoration: none; font-size: 14px; }
  a.btn:hover { background: #24301A; color: #F3F5EC; }
  a.btn-light { border-color: #FFFFFE; color: #FFFFFE; }
  a.btn-light:hover { background: #FFFFFE; color: #24301A; }
  .note { color: #5c4a36; font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
<p class="label">Sample 5 — Cover play</p>
<p class="hint">Demo video only. Your QuintaEarth video replaces it later.</p>

<style>
  #youtube .wrap { text-align: center; }
  .cover {
    position: relative; isolation: isolate; overflow: hidden;
    max-width: 720px; margin: 0 auto; aspect-ratio: 16/9;
    border: 1px solid #d5dbc8;
    background: #24301A center / cover no-repeat;
    background-image: url("../../assets/youtube-bg.jpg");
    cursor: pointer;
  }
  .cover::before {
    content: ""; position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 70% 55% at 50% 45%, rgba(20,28,12,0.4), rgba(20,28,12,0.65));
  }
  .cover .play {
    position: absolute; z-index: 1; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid #FFFFFE; background: rgba(20,28,12,0.35);
    display: flex; align-items: center; justify-content: center;
  }
  .cover .play::after {
    content: ""; display: block; width: 0; height: 0; margin-left: 4px;
    border-left: 18px solid #FFFFFE; border-top: 11px solid transparent; border-bottom: 11px solid transparent;
  }
  .cover .caption {
    position: absolute; z-index: 1; left: 0; right: 0; bottom: 18px;
    color: #F3F5EC; font-family: "Cormorant Garamond", serif; font-size: 28px; margin: 0;
    text-shadow: 0 1px 12px rgba(0,0,0,0.45);
  }
  .cover.is-playing .play, .cover.is-playing .caption, .cover.is-playing::before { display: none; }
  .cover .player { display: none; position: absolute; inset: 0; z-index: 2; }
  .cover.is-playing .player { display: block; }
  .below { max-width: 520px; margin: 16px auto 0; }
</style>
<section class="band" id="youtube"><div class="wrap">
  <h2>YouTube</h2>
  <div class="cover" id="cover" role="button" tabindex="0" aria-label="Play video">
    <div class="play" aria-hidden="true"></div>
    <p class="caption">Watch</p>
    <div class="player"><iframe data-src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ?autoplay=1" title="Sample video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>
  </div>
  <p class="note below">Films, maker notes, and greentech conversations from QuintaEarth.</p>
  <a class="btn" href="https://www.youtube.com/@QuintaEarth" target="_blank" rel="noopener">Visit channel</a>
</div></section>
<script>
(function(){
  var c = document.getElementById('cover');
  function play(){
    if (c.classList.contains('is-playing')) return;
    var f = c.querySelector('iframe');
    f.src = f.getAttribute('data-src');
    c.classList.add('is-playing');
  }
  c.addEventListener('click', play);
  c.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } });
})();
</script>
</body></html>
