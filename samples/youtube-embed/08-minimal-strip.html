<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>YouTube embed sample — Minimal strip</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #FFFFFE; color: #2c2419; }
  .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B7A45; padding: 16px 20px 8px; margin: 0; }
  .hint { font-size: 13px; color: #8a7a66; padding: 0 20px 8px; margin: 0; }
  .band { padding: 20px 0 48px; background: #FFFFFE; }
  .band::before { content: ""; display: block; width: min(920px, calc(100% - 64px)); height: 1px; margin: 0 auto 20px; background: #d9cbb4; }
  .wrap { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
  .band h2 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 36px; margin: 0 0 14px; letter-spacing: -0.01em; }
  .player { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; overflow: hidden; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  a.btn { display: inline-block; margin-top: 14px; padding: 10px 18px; border: 1px solid #24301A; color: #24301A; text-decoration: none; font-size: 14px; }
  a.btn:hover { background: #24301A; color: #F3F5EC; }
  a.btn-light { border-color: #FFFFFE; color: #FFFFFE; }
  a.btn-light:hover { background: #FFFFFE; color: #24301A; }
  .note { color: #5c4a36; font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
<p class="label">Sample 8 — Minimal strip</p>
<p class="hint">Demo video only. Your QuintaEarth video replaces it later.</p>

<style>
  #youtube .wrap { text-align: center; }
  .frame { max-width: 800px; margin: 8px auto 0; border: 1px solid #d5dbc8; }
  .actions { margin-top: 16px; }
</style>
<section class="band" id="youtube"><div class="wrap">
  <h2>YouTube</h2>
  <div class="frame"><div class="player"><iframe src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ" title="Sample video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div></div>
  <div class="actions"><a class="btn" href="https://www.youtube.com/@QuintaEarth" target="_blank" rel="noopener">Visit channel</a></div>
</div></section>
</body></html>
